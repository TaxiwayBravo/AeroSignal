name: Validate and package
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node --check app/static/app.js
      - run: for script in scripts/*.sh; do bash -n "$script"; done
      - run: docker compose --profile fr24 --profile flightaware --profile airnav --profile opensky config --quiet
        env:
          FEEDER_LAT: '51'
          FEEDER_LONG: '-1'
          FEEDER_ALT_M: '20'
          FEEDER_UUID: '00000000-0000-4000-8000-000000000001'
      - run: docker build -t aerosignal:test .
      - name: Smoke test dashboard container
        run: |
          docker run -d --name aerosignal-test -p 127.0.0.1:8080:8080 aerosignal:test
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://127.0.0.1:8080/health
          curl --fail http://127.0.0.1:8080/ | grep -q AeroSignal
          docker stop aerosignal-test
      - run: python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: aerosignal-pi-package
          path: release/
